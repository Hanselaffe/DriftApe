name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and development tools
        run: python -m pip install ".[dev]"

      - name: Run tests
        run: pytest

      - name: Compile Python sources
        run: python -m compileall -q driftape tests

      - name: Check module version entry point
        run: python -m driftape --version

      - name: Check console version entry point
        run: driftape --version

      - name: Check installed dependencies
        run: python -m pip check

      - name: Run Ruff lint
        run: ruff check .

      - name: Check Ruff formatting
        run: ruff format --check .

      - name: Run mypy
        run: mypy driftape
