name: Finalize DriftApe v0.1.0 release

on:
  push:
    paths:
      - ".driftape-release/READY"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_COMMIT: d7ab09d845b7c0a6479e0dee25365e1766275852
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release asset
        shell: bash
        run: |
          set -euo pipefail
          cd .driftape-release
          sha256sum -c DriftApe-v0.1.0.zip.sha256

      - name: Create or verify v0.1.0 tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force
          if git show-ref --verify --quiet refs/tags/v0.1.0; then
            actual="$(git rev-list -n 1 v0.1.0)"
            test "$actual" = "$TARGET_COMMIT"
          else
            git tag -a v0.1.0 "$TARGET_COMMIT" -m "DriftApe v0.1.0"
            git push origin refs/tags/v0.1.0
          fi

      - name: Create or update GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          NOTES=.driftape-release/DriftApe_GITHUB_RELEASE_NOTES_v0.1.0.md
          ZIP=.driftape-release/DriftApe-v0.1.0.zip
          SUM=.driftape-release/DriftApe-v0.1.0.zip.sha256
          if gh release view v0.1.0 >/dev/null 2>&1; then
            gh release edit v0.1.0 --title "DriftApe v0.1.0" --notes-file "$NOTES"
            gh release upload v0.1.0 "$ZIP" "$SUM" --clobber
          else
            gh release create v0.1.0 "$ZIP" "$SUM" --verify-tag --title "DriftApe v0.1.0" --notes-file "$NOTES"
          fi

      - name: Try repository metadata
        continue-on-error: true
        shell: bash
        run: |
          gh repo edit "$GITHUB_REPOSITORY" \
            --description "Local, defensive, read-only Windows security configuration and state drift detection CLI." \
            --add-topic windows-security \
            --add-topic configuration-drift \
            --add-topic defensive-security \
            --add-topic python \
            --add-topic powershell \
            --add-topic cli \
            --add-topic security-monitoring \
            --add-topic baseline

      - name: Remove temporary release files
        shell: bash
        run: |
          set -euo pipefail
          git checkout "$TARGET_COMMIT" -- .github/workflows/ci.yml
          git rm -r .driftape-release
          git rm .github/workflows/finalize-v0.1.0.yml
          git commit -m "Remove v0.1.0 release staging [skip ci]"
          git push origin HEAD:main

      - name: Remove obsolete trigger branch
        continue-on-error: true
        shell: bash
        run: |
          git push origin --delete release-trigger-v0.1.0
