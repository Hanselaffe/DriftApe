name: Publish DriftApe v0.1 source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v0.1-bootstrap.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct verified repository package
        shell: bash
        run: |
          set -euo pipefail
          cat .publish/part*.txt | base64 --decode > "$RUNNER_TEMP/repo.zip"
          echo "86ccb00cc51c566b38feee3241890f437bb3efc7f59dc0213e0931aae4a57938  $RUNNER_TEMP/repo.zip" | sha256sum -c -
          unzip -q -o "$RUNNER_TEMP/repo.zip" -x '.github/workflows/ci.yml' -d .
          rm -rf .publish

      - name: Commit published source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release DriftApe v0.1.0 source [skip ci]"
          git push origin HEAD:main
