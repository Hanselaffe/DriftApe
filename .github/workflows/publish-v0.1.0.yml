name: Publish DriftApe v0.1.0

on:
  push:
    paths:
      - ".driftape-publish/READY"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct verified repository archive
        shell: bash
        run: |
          set -euo pipefail
          cat .driftape-publish/part-*.txt > /tmp/driftape-repository.b64
          base64 --decode /tmp/driftape-repository.b64 > /tmp/DriftApe_v0.1.0_GITHUB_REPOSITORY.zip
          echo "86ccb00cc51c566b38feee3241890f437bb3efc7f59dc0213e0931aae4a57938  /tmp/DriftApe_v0.1.0_GITHUB_REPOSITORY.zip" | sha256sum -c -
          unzip -qo /tmp/DriftApe_v0.1.0_GITHUB_REPOSITORY.zip -d .
          git rm -r .driftape-publish
          git rm .github/workflows/publish-v0.1.0.yml

      - name: Commit DriftApe v0.1.0
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish DriftApe v0.1.0 [skip ci]"
          git push origin HEAD:main
